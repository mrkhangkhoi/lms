<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="auto">
  <defs>
    <linearGradient id="rectGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="ovalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="paraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="rhombGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>

  <rect width="800" height="240" rx="16" fill="#111827" stroke="#374151" stroke-width="1.5"/>

  <!-- Shape 1: Oval -->
  <g transform="translate(30, 40)">
    <rect x="0" y="20" width="150" height="60" rx="30" fill="url(#ovalGrad)" stroke="#34d399" stroke-width="2"/>
    <text x="75" y="55" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Bắt đầu / Kết thúc</text>
    <text x="75" y="110" fill="#9ca3af" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" text-anchor="middle">Hình ô-van</text>
  </g>

  <!-- Shape 2: Rectangle -->
  <g transform="translate(225, 40)">
    <rect x="0" y="20" width="150" height="60" rx="6" fill="url(#rectGrad)" stroke="#60a5fa" stroke-width="2"/>
    <text x="75" y="55" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Xử lý / Tính toán</text>
    <text x="75" y="110" fill="#9ca3af" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" text-anchor="middle">Hình chữ nhật</text>
  </g>

  <!-- Shape 3: Parallelogram -->
  <g transform="translate(420, 40)">
    <polygon points="25,20 150,20 125,80 0,80" fill="url(#paraGrad)" stroke="#fbbf24" stroke-width="2"/>
    <text x="75" y="55" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Vào / Ra dữ liệu</text>
    <text x="75" y="110" fill="#9ca3af" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" text-anchor="middle">Hình bình hành</text>
  </g>

  <!-- Shape 4: Rhombus -->
  <g transform="translate(615, 40)">
    <polygon points="75,10 150,50 75,90 0,50" fill="url(#rhombGrad)" stroke="#a78bfa" stroke-width="2"/>
    <text x="75" y="55" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle">Kiểm tra điều kiện</text>
    <text x="75" y="110" fill="#9ca3af" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" text-anchor="middle">Hình thoi</text>
  </g>

  <text x="400" y="215" fill="#e5e7eb" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" text-anchor="middle">Hình 1. Các quy ước chuẩn về khối hình trong biểu diễn thuật toán Tin học</text>
</svg>